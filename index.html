<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoostGames — Каталог сборок</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --accent-color: #5865f2;
      --accent-hover: #4752c4;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --border-color: #2b2d31;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Боковая панель */
    .sidebar {
      width: 280px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .profile-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      margin-bottom: 12px;
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .profile-fav {
      font-size: 0.8rem;
      color: #ebdbb2;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.03);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-weight: 600;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    /* Основной контент */
    .main-content {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-x: hidden;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .top-title {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      color: white;
      width: 300px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-color);
    }

    /* Сетка карточек игр */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .game-card:hover {
      border-color: #3f4248;
      transform: translateY(-2px);
    }

    .game-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .game-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .game-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .game-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
    }

    /* Вкладки */
    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }

    /* Отзывы */
    .reviews-list {
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0,0,0,0.25);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .review-item {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
    }

    .review-author {
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Модалка */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 14px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Боковая панель -->
  <aside class="sidebar">
    <h2 style="text-align:center;">BoostGames</h2>
    <div class="profile-card">
      <img id="userAvatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150" class="profile-avatar" alt="Avatar">
      <div id="userName" class="profile-name">Игрок</div>
      <div id="userStatus" class="profile-status">В поиске сборок...</div>
      <div id="userFav" class="profile-fav">Любимая: S.T.A.L.K.E.R.</div>
    </div>
    <button class="btn" id="btnOpenProfile">Редактировать профиль</button>

    <div class="nav-menu">
      <button class="nav-btn active" id="btn-tab-catalog">🔥 Главная (Популярное)</button>
      <button class="nav-btn" id="btn-tab-library">📚 Моя библиотека</button>
    </div>
  </aside>

  <!-- Контент -->
  <main class="main-content">
    
    <!-- Вкладка: Каталог -->
    <div id="tab-catalog" class="tab-section active">
      <div class="top-bar">
        <div class="top-title">🔥 Сейчас популярно</div>
        <input type="text" class="search-box" id="searchBox" placeholder="Поиск игры по названию...">
      </div>

      <div class="games-grid" id="gamesGrid" style="margin-top: 20px;">
        <!-- Карточки наполняются через JS -->
      </div>
    </div>

    <!-- Вкладка: Библиотека -->
    <div id="tab-library" class="tab-section">
      <h2 style="margin-bottom:16px;">Моя библиотека скачанных игр</h2>
      <div id="libraryContainer" class="games-grid">
        <!-- Сюда попадают скачанные игры -->
      </div>
    </div>

  </main>

  <!-- Модалка профиля -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <h3>Редактировать профиль</h3>
      <input type="text" id="editName" placeholder="Имя">
      <input type="text" id="editAvatar" placeholder="Ссылка на аватар">
      <input type="text" id="editStatus" placeholder="Статус">
      <input type="text" id="editFav" placeholder="Любимая игра">
      <button class="btn" id="btnSaveProfile">Сохранить</button>
      <button class="btn" style="background:#3f4248" id="btnCloseProfile">Отмена</button>
    </div>
  </div>

  <!-- Единственный модуль Script, предотвращающий падения JS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgUPJKUJmKvEMVWHjocms_XEOkUvxkjNw",
      authDomain: "boostgames-a16b1.firebaseapp.com",
      databaseURL: "https://boostgames-a16b1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "boostgames-a16b1",
      storageBucket: "boostgames-a16b1.firebasestorage.app",
      messagingSenderId: "209245537661",
      appId: "1:209245537661:web:5b7c329d35536e47ccf814"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const games = [
      { id: 'ets2', title: 'Euro Truck Simulator 2', tags: ['DODI', 'Rutracker', 'OnlineFix'], img: ' https://i.playground.ru/e/1m5fWmshbvN12eWkcU3Jog.jpeg},
      { id: 'rdr2', title: 'Red Dead Redemption 2', tags: ['DODI', 'Fitgirl', 'RexaGames'], img: 'https://avatars.mds.yandex.net/i?id=332c68d038193af60e61fcc4ab064f52_l-12373254-images-thumbs&n=13 },
      { id: 'stalker_anomaly', title: 'S.T.A.L.K.E.R. Anomaly', tags: ['Custom Pack', 'Lossless Scaling'], img: 'https://static.wikia.nocookie.net/stalker/images/c/c5/Anomaly03.jpg/revision/latest/scale-to-width-down/536?cb=20251025161017&path-prefix=ru' },
      { id: 'stalker_gamma', title: 'S.T.A.L.K.E.R. GAMMA', tags: ['Modpack', 'Hardcore'], img: 'https://torrents.ws/_ld/70/7041.webp'' },
      { id: 'stalker2', title: 'S.T.A.L.K.E.R. 2: Heart of Chornobyl', tags: ['DODI', 'Official'], img: 'https://avatars.mds.yandex.net/get-mpic/12260097/2a000001934ea0687c32de58847ad3ca473c/orig '' },
      { id: 'blood_dawn', title: 'The Blood of Dawnwalker', tags: ['RPG', 'New'], img: 'https://avatars.mds.yandex.net/get-mpic/18718263/2a0000019fbb99904a3671258e6aafd98373/orig '' },
      { id: 'spiderman', title: "Marvel's Spider-Man Remastered", tags: ['DODI', 'Rutracker'], img: ' https://www.1c-interes.ru/images/2022/11/spider_man_remastered_pc_main.jpg'' },
      { id: 'tlou', title: 'The Last of Us Part I', tags: ['Fitgirl', 'DODI'], img: 'https://www.gamespot.com/a/uploads/scale_medium/1197/11970954/2435519-image.jpeg '' },
      { id: 'witcher3', title: 'The Witcher 3: Wild Hunt', tags: ['Wolf School', 'Bear School'], img: 'https://avatars.mds.yandex.net/i?id=37b2a9f6a6090f0abd3d94f7dcc7d457_l-11860401-images-thumbs&n=13 '' },
      { id: 'metro', title: 'Metro Exodus Enhanced Edition', tags: ['DODI', 'RexaGames'], img: 'https://store-images.s-microsoft.com/image/apps.17469.65642028844779555.c518e652-fc85-4d6e-99a2-3e9ae1656a91.6cace333-df13-4178-a46d-5938de4654a2 '' },
      { id: 'skyrim', title: 'The Elder Scrolls V: Skyrim', tags: ['Mod Organizer 2', 'Thieves Guild'], img: ' https://images.gog-statics.com/ddedeef7636157b558d2fac8fa8a6c0d28e6fab0668c6aab7fd28220f29ec734.jpg'' }
    ];

    // Подгрузка отзывов из Firebase
    function listenReviews(gameId) {
      const reviewsRef = ref(db, 'reviews/' + gameId);
      onValue(reviewsRef, (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('reviews-' + gameId);
        if (!container) return;
        container.innerHTML = '';

        if (!data) {
          container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem;">Пока нет отзывов</div>';
          return;
        }

        Object.keys(data).forEach(key => {
          const item = data[key];
          const div = document.createElement('div');
          div.className = 'review-item';
          div.innerHTML = `<span class="review-author">${escapeHtml(item.user)}:</span> ${escapeHtml(item.text)}`;
          container.appendChild(div);
        });
      });
    }

    // Отрисовка каталога
    function renderCatalog(filterText = '') {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const filtered = games.filter(g => g.title.toLowerCase().includes(filterText.toLowerCase()));

      filtered.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.img}" alt="${game.title}">
          <div class="game-body">
            <div class="game-title">${game.title}</div>
            <div class="tags-row">
              ${game.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            
            <div style="font-size:0.8rem; font-weight:bold; margin-top:4px;">Отзывы:</div>
            <div class="reviews-list" id="reviews-${game.id}">Загрузка...</div>

            <div class="game-actions">
              <button class="btn btn-download" data-id="${game.id}" style="width:100%;">Скачать сборку</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
        listenReviews(game.id);
      });

      document.querySelectorAll('.btn-download').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.getAttribute('data-id');
          startDownload(id);
        });
      });
    }

    // Скачивание
    function startDownload(gameId) {
      const game = games.find(g => g.id === gameId);
      if (!game || !game.fileUrl) {
        alert('Файл для этой сборки еще не загружен на сервер!');
        return;
      }

      window.open(game.fileUrl, '_blank');

      let library = JSON.parse(localStorage.getItem('user_library') || '[]');
      if (!library.includes(gameId)) {
        library.push(gameId);
        localStorage.setItem('user_library', JSON.stringify(library));
      }
      alert('Сборка добавлена в вашу библиотеку!');
    }

    // Отрисовка библиотеки
    function renderLibrary() {
      const container = document.getElementById('libraryContainer');
      const library = JSON.parse(localStorage.getItem('user_library') || '[]');
      container.innerHTML = '';

      if (library.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">У вас пока нет скачанных игр. Скачайте сборку из каталога, чтобы оставить отзыв.</p>';
        return;
      }

      library.forEach(gameId => {
        const game = games.find(g => g.id === gameId);
        if (!game) return;

        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.img}" alt="${game.title}">
          <div class="game-body">
            <div class="game-title">${game.title}</div>
            <p style="font-size:0.8rem; color:#23a55a;">✓ Установлено в библиотеке</p>
            
            <div style="margin-top:6px;">
              <h4 style="font-size:0.85rem; margin-bottom:4px;">Написать отзыв:</h4>
              <input type="text" id="lib-input-${gameId}" placeholder="Ваш отзыв..." style="width:100%; padding:6px; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); color:white; border-radius:6px; margin-bottom:4px; font-size:0.85rem;">
              <button class="btn btn-send-review" data-id="${gameId}" style="width:100%; padding:6px;">Опубликовать</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll('.btn-send-review').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.getAttribute('data-id');
          sendReviewFromLibrary(id);
        });
      });
    }

    // Отправка отзыва
    function sendReviewFromLibrary(gameId) {
      const input = document.getElementById('lib-input-' + gameId);
      const text = input.value.trim();
      const userName = localStorage.getItem('profile_name') || 'Игрок';

      if (!text) return;

      const reviewsRef = ref(db, 'reviews/' + gameId);
      push(reviewsRef, {
        user: userName,
        text: text,
        timestamp: Date.now()
      });

      input.value = '';
      alert('Отзыв опубликован в общей базе!');
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Навигация и Профиль
    function switchTab(tabName) {
      document.getElementById('btn-tab-catalog').classList.remove('active');
      document.getElementById('btn-tab-library').classList.remove('active');
      document.getElementById('tab-catalog').classList.remove('active');
      document.getElementById('tab-library').classList.remove('active');

      document.getElementById('btn-tab-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');

      if (tabName === 'library') renderLibrary();
    }

    function loadProfile() {
      document.getElementById('userName').textContent = localStorage.getItem('profile_name') || 'Игрок';
      document.getElementById('userAvatar').src = localStorage.getItem('profile_avatar') || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150';
      document.getElementById('userStatus').textContent = localStorage.getItem('profile_status') || 'В поиске сборок...';
      document.getElementById('userFav').textContent = 'Любимая: ' + (localStorage.getItem('profile_fav') || 'S.T.A.L.K.E.R.');
    }

    // События
    document.getElementById('btn-tab-catalog').addEventListener('click', () => switchTab('catalog'));
    document.getElementById('btn-tab-library').addEventListener('click', () => switchTab('library'));

    document.getElementById('searchBox').addEventListener('input', (e) => {
      renderCatalog(e.target.value);
    });

    document.getElementById('btnOpenProfile').addEventListener('click', () => {
      document.getElementById('editName').value = localStorage.getItem('profile_name') || '';
      document.getElementById('editAvatar').value = localStorage.getItem('profile_avatar') || '';
      document.getElementById('editStatus').value = localStorage.getItem('profile_status') || '';
      document.getElementById('editFav').value = localStorage.getItem('profile_fav') || '';
      document.getElementById('profileModal').style.display = 'flex';
    });

    document.getElementById('btnCloseProfile').addEventListener('click', () => {
      document.getElementById('profileModal').style.display = 'none';
    });

    document.getElementById('btnSaveProfile').addEventListener('click', () => {
      localStorage.setItem('profile_name', document.getElementById('editName').value);
      localStorage.setItem('profile_avatar', document.getElementById('editAvatar').value);
      localStorage.setItem('profile_status', document.getElementById('editStatus').value);
      localStorage.setItem('profile_fav', document.getElementById('editFav').value);
      loadProfile();
      document.getElementById('profileModal').style.display = 'none';
    });

    // Старт
    loadProfile();
    renderCatalog();
  </script>
</body>
</html>
