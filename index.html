<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostGames — Launcher Catalog</title>
    <style>
        :root {
            --bg-color: #0b0d14;
            --sidebar-bg: #121520;
            --card-bg: #1a1d2e;
            --accent-color: #00ff88;
            --text-color: #e0e6ed;
            --text-secondary: #94a3b8;
            --border-color: #262b40;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Боковая панель */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 1rem;
            outline: none;
            width: 140px;
        }

        .username-input:focus {
            border-bottom: 1px solid var(--accent-color);
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent-color);
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item button {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            color: var(--text-secondary);
            background: none;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .nav-item button:hover, .nav-item button.active {
            background-color: var(--card-bg);
            color: var(--accent-color);
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        header {
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2rem;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
        }

        /* Фильтры категорий (Жанры) */
        .categories-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* Сетка карточек */
        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            transition: transform 0.2s ease;
        }

        .game-img {
            width: 240px;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #10121b;
            flex-shrink: 0;
        }

        .game-info {
            flex: 1;
            min-width: 260px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .game-title {
            color: var(--accent-color);
            font-size: 1.4rem;
        }

        .genre-badge {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 0.88rem;
        }

        .specs-table td {
            padding: 5px 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .specs-table tr:last-child td {
            border-bottom: none;
        }

        .specs-table td:first-child {
            color: var(--text-secondary);
            width: 35%;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            display: inline-block;
            padding: 8px 18px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: opacity 0.2s ease;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn.disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .btn-library {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-library:hover, .btn-library.saved {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .game-img {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>
