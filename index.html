<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoostGames — Оптимизированные сборки</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --accent-color: #5865f2;
      --accent-hover: #4752c4;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --border-color: #2b2d31;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Боковая панель */
    .sidebar {
      width: 300px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .profile-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }

    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      margin-bottom: 12px;
    }

    .profile-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .profile-fav {
      font-size: 0.8rem;
      color: #ebdbb2;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.03);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-weight: 600;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    /* Главный контент */
    .main-content {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-x: hidden;
    }

    /* Лента жанров */
    .genres-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .genres-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 4px 0;
    }

    .genres-container::-webkit-scrollbar {
      display: none;
    }

    .genre-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 500;
    }

    .genre-btn.active, .genre-btn:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    /* Сетка игр */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .game-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* Раздел отзывов в игре */
    .reviews-list {
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .review-item {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
    }

    .review-author {
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Модалка */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 14px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }

    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Боковое меню -->
  <aside class="sidebar">
    <h2 style="text-align:center;">BoostGames</h2>
    <div class="profile-card">
      <img id="userAvatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150" class="profile-avatar" alt="Avatar">
      <div id="userName" class="profile-name">Игрок</div>
      <div id="userStatus" class="profile-status">В поиске сборок...</div>
      <div id="userFav" class="profile-fav">Любимая: S.T.A.L.K.E.R.</div>
    </div>
    <button class="btn" onclick="openProfileModal()">Редактировать профиль</button>

    <div class="nav-menu">
      <button class="nav-btn active" onclick="switchTab('catalog', this)">🎮 Каталог</button>
      <button class="nav-btn" onclick="switchTab('library', this)">📚 Моя библиотека</button>
    </div>
  </aside>
