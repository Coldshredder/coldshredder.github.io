<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BoostGames — Каталог сборок</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151922;
      --accent-color: #5865f2;
      --accent-hover: #4752c4;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --border-color: #2b2d31;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Боковая панель */
    .sidebar {
      width: 280px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .profile-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      margin-bottom: 12px;
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .profile-fav {
      font-size: 0.8rem;
      color: #ebdbb2;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-btn {
      background: rgba(255,255,255,0.03);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-weight: 600;
    }

    .nav-btn:hover, .nav-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    /* Основной контент */
    .main-content {
      flex: 1;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow-x: hidden;
    }

    /* Верхняя панель (поиск как на скриншоте) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .top-title {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      color: white;
      width: 300px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-color);
    }

    /* Сетка карточек игр в стиле лаунчера */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .game-card:hover {
      border-color: #3f4248;
      transform: translateY(-2px);
    }

    .game-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .game-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .game-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    /* Теги репаков (как на скрине Dodi, Fitgirl и т.д.) */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .game-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
    }

    /* Вкладки */
    .tab-section {
      display: none;
    }

    .tab-section.active {
      display: block;
    }

    /* Отзывы */
    .reviews-list {
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0,0,0,0.25);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .review-item {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
    }

    .review-author {
      font-weight: 700;
      color: var(--accent-color);
    }

    /* Модалка */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 14px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Боковая панель -->
  <aside class="sidebar">
    <h2 style="text-align:center;">BoostGames</h2>
    <div class="profile-card">
      <img id="userAvatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150" class="profile-avatar" alt="Avatar">
      <div id="userName" class="profile-name">Игрок</div>
      <div id="userStatus" class="profile-status">В поиске сборок...</div>
      <div id="userFav" class="profile-fav">Любимая: S.T.A.L.K.E.R.</div>
    </div>
    <button class="btn" onclick="openProfileModal()">Редактировать профиль</button>

    <div class="nav-menu">
      <button class="nav-btn active" id="btn-tab-catalog" onclick="switchTab('catalog')">🔥 Главная (Популярное)</button>
      <button class="nav-btn" id="btn-tab-library" onclick="switchTab('library')">📚 Моя библиотека</button>
    </div>
  </aside>

  <!-- Контент -->
  <main class="main-content">
    
    <!-- Вкладка: Каталог -->
    <div id="tab-catalog" class="tab-section active">
      <div class="top-bar">
        <div class="top-title">🔥 Сейчас популярно</div>
        <input type="text" class="search-box" id="searchBox" placeholder="Поиск игры по названию..." oninput="filterGames()">
      </div>

      <div class="games-grid" id="gamesGrid">
        <!-- Карточки заполняются скриптом динамически для удобства -->
      </div>
    </div>

    <!-- Вкладка: Библиотека -->
    <div id="tab-library" class="tab-section">
      <h2 style="margin-bottom:16px;">Моя библиотека скачанных игр</h2>
      <div id="libraryContainer" class="games-grid">
        <!-- Сюда попадают скачанные игры -->
      </div>
    </div>

  </main>

  <!-- Модалка профиля -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <h3>Редактировать профиль</h3>
      <input type="text" id="editName" placeholder="Имя">
      <input type="text" id="editAvatar" placeholder="Ссылка на аватар">
      <input type="text" id="editStatus" placeholder="Статус">
      <input type="text" id="editFav" placeholder="Любимая игра">
      <button class="btn" onclick="saveProfile()">Сохранить</button>
      <button class="btn" style="background:#3f4248" onclick="closeProfileModal()">Отмена</button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgUPJKUJmKvEMVWHjocms_XEOkUvxkjNw",
      authDomain: "boostgames-a16b1.firebaseapp.com",
      databaseURL: "https://boostgames-a16b1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "boostgames-a16b1",
      storageBucket: "boostgames-a16b1.firebasestorage.app",
      messagingSenderId: "209245537661",
      appId: "1:209245537661:web:5b7c329d35536e47ccf814"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Загрузка отзывов для каждой игры
    window.initFirebaseReviews = function(gameIds) {
      gameIds.forEach(gameId => {
        const reviewsRef = ref(db, 'reviews/' + gameId);
        onValue(reviewsRef, (snapshot) => {
          const data = snapshot.val();
          const container = document.getElementById('reviews-' + gameId);
          if (container) container.innerHTML = '';

          if (!data) {
            if (container) container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem;">Пока нет отзывов</div>';
            return;
          }

          Object.keys(data).forEach(key => {
            const item = data[key];
            const div = document.createElement('div');
            div.className = 'review-item';
            div.innerHTML = `<span class="review-author">${escapeHtml(item.user)}:</span> ${escapeHtml(item.text)}`;
            if (container) container.appendChild(div);
          });
        });
      });
    };

    window.sendReviewFromLibrary = function(gameId) {
      const input = document.getElementById('lib-input-' + gameId);
      const text = input.value.trim();
      const userName = localStorage.getItem('profile_name') || 'Игрок';

      if (!text) return;

      const reviewsRef = ref(db, 'reviews/' + gameId);
      push(reviewsRef, {
        user: userName,
        text: text,
        timestamp: Date.now()
      });

      input.value = '';
      alert('Отзыв отправлен в облако!');
    };

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>

  <!-- Логика лаунчера и каталога -->
  <script>
    const games = [
      { id: 'ets2', title: 'Euro Truck Simulator 2', tags: ['DODI', 'Rutracker', 'OnlineFix'], img: 'https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=500', fileUrl: 'https://example.com/ets2.zip' },
      { id: 'rdr2', title: 'Red Dead Redemption 2', tags: ['DODI', 'Fitgirl', 'RexaGames'], img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500', fileUrl: 'https://example.com/rdr2.zip' },
      { id: 'stalker_anomaly', title: 'S.T.A.L.K.E.R. Anomaly', tags: ['Custom Pack', 'Lossless Scaling'], img: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500', fileUrl: 'https://example.com/anomaly.zip' },
      { id: 'stalker_gamma', title: 'S.T.A.L.K.E.R. GAMMA', tags: ['Modpack', 'Hardcore'], img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500', fileUrl: '' },
      { id: 'stalker2', title: 'S.T.A.L.K.E.R. 2: Heart of Chornobyl', tags: ['DODI', 'Official'], img: 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500', fileUrl: '' },
      { id: 'blood_dawn', title: 'The Blood of Dawn Walker', tags: ['RPG', 'New'], img: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500', fileUrl: '' },
      { id: 'spiderman', title: "Marvel's Spider-Man Remastered", tags: ['DODI', 'Rutracker'], img: 'https://images.unsplash.com/photo-1635863138275-d9b33299680b?w=500', fileUrl: '' },
      { id: 'tlou', title: 'The Last of Us Part I', tags: ['Fitgirl', 'DODI'], img: 'https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=500', fileUrl: '' },
      { id: 'witcher3', title: 'The Witcher 3: Wild Hunt (Next-Gen)', tags: ['Wolf School', 'Bear School'], img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500', fileUrl: '' },
      { id: 'metro', title: 'Metro Exodus Enhanced Edition', tags: ['DODI', 'RexaGames'], img: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500', fileUrl: '' },
      { id: 'skyrim', title: 'The Elder Scrolls V: Skyrim Special Edition', tags: ['Mod Organizer 2', 'Thieves Guild'], img: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500', fileUrl: '' }
    ];

    function renderCatalog(filterText = '') {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      const filtered = games.filter(g => g.title.toLowerCase().includes(filterText.toLowerCase()));

      filtered.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.img}" alt="${game.title}">
          <div class="game-body">
            <div class="game-title">${game.title}</div>
            <div class="tags-row">
              ${game.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            
            <div style="font-size:0.8rem; font-weight:bold; margin-top:4px;">Отзывы:</div>
            <div class="reviews-list" id="reviews-${game.id}">Загрузка...</div>

            <div class="game-actions">
              <button class="btn" style="width:100%;" onclick="startDownload('${game.id}', '${game.fileUrl}')">Скачать сборку</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // Инициализируем подгрузку отзывов из Firebase для отображаемых игр
      if (window.initFirebaseReviews) {
        window.initFirebaseReviews(games.map(g => g.id));
      }
    }

    function filterGames() {
      const query = document.getElementById('searchBox').value;
      renderCatalog(query);
    }

    // Скачивание и добавление в библиотеку
    function startDownload(gameId, fileUrl) {
      if (!fileUrl) {
        alert('Файл для этой сборки еще не загружен на сервер!');
        return;
      }

      window.open(fileUrl, '_blank');

      let library = JSON.parse(localStorage.getItem('user_library') || '[]');
      if (!library.includes(gameId)) {
        library.push(gameId);
        localStorage.setItem('user_library', JSON.stringify(library));
      }
      alert('Сборка успешно добавлена в вашу библиотеку!');
    }

    // Отрисовка Библиотеки
    function renderLibrary() {
      const container = document.getElementById('libraryContainer');
      const library = JSON.parse(localStorage.getItem('user_library') || '[]');
      container.innerHTML = '';

      if (library.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">У вас пока нет скачанных игр. Скачайте сборку из каталога, чтобы оставить отзыв.</p>';
        return;
      }

      library.forEach(gameId => {
        const game = games.find(g => g.id === gameId);
        if (!game) return;

        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${game.img}" alt="${game.title}">
          <div class="game-body">
            <div class="game-title">${game.title}</div>
            <p style="font-size:0.8rem; color:#23a55a;">✓ Установлено в библиотеке</p>
            
            <div style="margin-top:6px;">
              <h4 style="font-size:0.85rem; margin-bottom:4px;">Написать отзыв:</h4>
              <input type="text" id="lib-input-${gameId}" placeholder="Ваш отзыв..." style="width:100%; padding:6px; background:rgba(0,0,0,0.3); border:1px solid var(--border-color); color:white; border-radius:6px; margin-bottom:4px; font-size:0.85rem;">
              <button class="btn" style="width:100%; padding:6px;" onclick="sendReviewFromLibrary('${gameId}')">Опубликовать</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Вкладки
    function switchTab(tabName) {
      document.getElementById('btn-tab-catalog').classList.remove('active');
      document.getElementById('btn-tab-library').classList.remove('active');
      document.getElementById('tab-catalog').classList.remove('active');
      document.getElementById('tab-library').classList.remove('active');

      document.getElementById('btn-tab-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');

      if (tabName === 'library') renderLibrary();
    }

    // Профиль
    function loadProfile() {
      document.getElementById('userName').textContent = localStorage.getItem('profile_name') || 'Игрок';
      document.getElementById('userAvatar').src = localStorage.getItem('profile_avatar') || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150';
      document.getElementById('userStatus').textContent = localStorage.getItem('profile_status') || 'В поиске сборок...';
      document.getElementById('userFav').textContent = 'Любимая: ' + (localStorage.getItem('profile_fav
