<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт</title>
    <style>
        /* 
          ==================================================
          1. ПЕРЕМЕННЫЕ ДИЗАЙНА (Цвета меняются здесь одной строкой)
          ==================================================
        */
        :root {
            --bg-color: #0f111a;        /* Цвет фона сайта */
            --card-bg: #1a1d2e;         /* Цвет блоков/карточек */
            --accent-color: #00ff88;    /* Основной акцент (кнопки, неоновый цвет) */
            --text-color: #e0e6ed;      /* Основной цвет текста */
            --text-secondary: #94a3b8;  /* Цвет второстепенного текста */
            --border-color: #2e344e;    /* Цвет границ и рамок */
        }

        /* Общие базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Шапка сайта */
        header {
            text-align: center;
            padding: 50px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.8rem;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        /* Основной контейнер для твоего будущего контента */
        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            /* Сетка для карточек (автоматически выстраивает их в ряды) */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        /* Шаблон пустого блока (можно использовать как основу для будущих игр) */
        .empty-block {
            background-color: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* Подвал сайта */
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- ШАПКА САЙТА (Изменяй текст тут) -->
    <header>
        <h1>Название Проекта</h1>
        <p>Здесь будет описание твоего сайта или каталога.</p>
    </header>

    <!-- ОСНОВНАЯ ЧАСТЬ (Сюда ты будешь добавлять контент) -->
    <div class="container">
        
        <!-- Временный пустой блок, показывающий, что сайт работает -->
        <div class="empty-block">
            Сайт пуст :) Скоро здесь появятся твои сборки.
        </div>

    </div>

    <!-- ПОДВАЛ САЙТА -->
    <footer>
        <p>© 2026. Все права защищены.</p>
    </footer>

</body>
</html>
